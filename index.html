<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رستو فاير - Rosto Fire | المنيو الإلكتروني</title>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --card-color: #262626;
            --primary-color: #ff4500;
            --primary-hover: #ff6a33;
            --accent-gold: #ffb703;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --border-color: #333333;
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 110px;
        }

        /* Header & Fire Logo */
        header {
            background: linear-gradient(135deg, #1a0a06 0%, #0d0d0d 45%, #150d0a 100%);
            border-bottom: 2px solid rgba(255, 69, 0, 0.8);
            padding: 28px 15px 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .fire-logo-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .chef-hat-fire {
            position: relative;
            width: 78px;
            height: 62px;
            background: linear-gradient(180deg, #fff 0%, #f9f4ef 100%);
            border-radius: 36px 36px 16px 16px;
            box-shadow: 0 0 22px rgba(255, 102, 0, 0.75), 0 10px 24px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -16px;
            z-index: 2;
            border: 2px solid rgba(255, 123, 69, 0.6);
            animation: hatGlow 2.1s infinite alternate;
        }

        .chef-hat-fire::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 16px;
            background: linear-gradient(180deg, #e8e8e8, #d2d2d2);
            border-radius: 0 0 12px 12px;
        }

        .flame-top {
            position: absolute;
            top: -30px;
            width: 28px;
            height: 38px;
            background: linear-gradient(180deg, #ffef7a 0%, #ffb703 20%, #ff5e00 58%, #ff2d00 100%);
            border-radius: 50% 50% 45% 45% / 55% 55% 35% 35%;
            animation: flameFlicker 0.45s infinite alternate ease-in-out;
            box-shadow: 0 0 18px rgba(255, 146, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.9);
            transform-origin: bottom center;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-4deg); opacity: 0.9; }
            100% { transform: scale(1.18) rotate(4deg); opacity: 1; filter: brightness(1.2); }
        }

        @keyframes hatGlow {
            0% { box-shadow: 0 0 14px rgba(255, 69, 0, 0.55), 0 10px 24px rgba(0,0,0,0.25); }
            100% { box-shadow: 0 0 28px rgba(255, 106, 51, 0.9), 0 14px 30px rgba(0,0,0,0.3); }
        }

        .brand-banner {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 30px 12px;
            min-width: min(82vw, 460px);
            border-radius: 24px;
            border: 3px solid rgba(255, 120, 60, 0.9);
            background: linear-gradient(180deg, rgba(43, 17, 10, 0.96), rgba(16, 12, 12, 0.98));
            box-shadow: 0 0 26px rgba(255, 98, 0, 0.7), 0 0 40px rgba(255, 98, 0, 0.35), inset 0 0 18px rgba(255, 159, 79, 0.08);
            margin: 8px auto 0;
        }

        .brand-name {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .brand-name .rosto {
            font-size: clamp(2.3rem, 4.4vw, 4.4rem);
            color: #f7f3ef;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(255, 145, 70, 0.45), 0 0 10px rgba(255,255,255,0.08);
        }

        .brand-name .fire {
            position: relative;
            display: inline-block;
            font-size: clamp(1.25rem, 2.3vw, 2.3rem);
            color: #ff8f2d;
            margin-left: 6px;
            transform: translateY(-8px);
            text-shadow: 0 0 12px rgba(255, 150, 0, 0.95), 0 0 20px rgba(255, 97, 0, 0.9), 0 0 30px rgba(255, 97, 0, 0.7);
            animation: fireGlow 1.1s infinite alternate ease-in-out;
        }

        .brand-name .fire::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 100%;
            width: 20px;
            height: 20px;
            transform: translateX(-50%);
            background: radial-gradient(circle at 50% 30%, #fff9b5 0%, #ffd65a 18%, #ffb703 28%, #ff7a00 58%, #ff3b00 100%);
            border-radius: 50% 50% 45% 45% / 60% 60% 30% 30%;
            filter: blur(0.4px);
            box-shadow: 0 0 14px rgba(255, 150, 0, 0.85), 0 0 26px rgba(255, 90, 0, 0.9), 0 0 36px rgba(255, 90, 0, 0.68);
        }

        @keyframes fireGlow {
            0% { filter: brightness(0.9); }
            100% { filter: brightness(1.4); }
        }

        header h1 {
            font-size: clamp(1.8rem, 3vw, 2.7rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 3px 14px rgba(255, 69, 0, 0.6);
        }

        header h1 span {
            color: var(--primary-color);
        }

        header p {
            color: var(--accent-gold);
            font-size: 1rem;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: 1.8px;
        }

        /* Categories Quick Navigation */
        .categories-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px;
            background: var(--surface-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 69, 0, 0.4);
        }

        /* Menu Container */
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Section Styling */
        .menu-section {
            background: var(--surface-color);
            border-radius: var(--radius);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .section-header {
            position: relative;
            height: 130px;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.28), rgba(18, 18, 18, 0.78)),
                        radial-gradient(circle at top right, rgba(255, 183, 3, 0.22), transparent 38%);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .section-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(18,18,18,0.92), rgba(18,18,18,0.2));
        }

        .section-header h2 {
            position: relative;
            z-index: 2;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        /* Items List */
        .items-list {
            padding: 10px 15px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            min-width: 120px;
        }

        .sizes-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .size-pill {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 7px 11px;
            min-width: 56px;
            font-size: 0.76rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.2px;
        }

        .size-pill:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.04);
        }

        .size-pill.active {
            background: linear-gradient(135deg, var(--primary-color), #ff7b45);
            color: #fff;
            box-shadow: 0 8px 18px rgba(255, 69, 0, 0.35);
            transform: translateY(-1px);
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 2px 12px rgba(255,183,3,0.25);
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, #2a2a2a 0%, #1e1e1e 100%);
            color: var(--primary-color);
            border: 1px solid rgba(255, 69, 0, 0.7);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
        }

        .add-to-cart-btn:hover {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.28);
        }

        /* Floating Cart Bar */
        .floating-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid var(--primary-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
            z-index: 1000;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.93rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #23c865 0%, #1bb658 100%);
            color: #fff;
        }

        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #2ad772 0%, #1fae52 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(37, 211, 102, 0.32);
        }

        .btn-call {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .btn-call:hover {
            background: linear-gradient(135deg, #343434 0%, #202020 100%);
            transform: translateY(-1px);
        }

        /* Cart Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .cart-modal {
            background: var(--surface-color);
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-top: 2px solid var(--primary-color);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 15px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-color);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
        }

        @media(min-width: 768px) {
            .cart-modal {
                border-radius: 20px;
                max-height: 80vh;
            }
            .modal-overlay {
                align-items: center;
            }
        }
    </style>
</head>

        // عزل سلة المشتريات والبيانات لكل جهاز (معرّف فريد خاص بالمتصفح)
        let deviceCartKey = 'rosto_cart_' + (localStorage.getItem('rosto_device_id') || Math.random().toString(36.25));
        if (!localStorage.getItem('rosto_device_id')) {
            localStorage.setItem('rosto_device_id', deviceCartKey);
        }

        let cart = JSON.parse(localStorage.getItem(deviceCartKey)) || [];

        function saveCart() {
            localStorage.setItem(deviceCartKey, JSON.stringify(cart));
            updateCartUI();
        }

        // تهيئة الصفحة وبناء الأقسام
        function initMenu() {
            const nav = document.getElementById('categoriesNav');
            const container = document.getElementById('menuContainer');
            
            nav.innerHTML = '';
            container.innerHTML = '';

            menuData.forEach((cat, index) => {
                // زر التنقل السريع
                const btn = document.createElement('button');
                btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = cat.name;
                btn.onclick = () => {
                    document.getElementById(cat.id).scrollIntoView({ behavior: 'smooth' });
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                nav.appendChild(btn);

                // قسم المنيو
                const section = document.createElement('div');
                section.className = 'menu-section';
                section.id = cat.id;

                let itemsHTML = '';
                cat.items.forEach((item, itemIdx) => {
                    if (cat.hasSizes) {
                        const defaultSizeIdx = 0;
                        itemsHTML += `
                            <div class="menu-item">
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                </div>
                                <div class="item-action">
                                    <div class="sizes-container">
                                        <button class="size-pill active" onclick="changeSize(this, '${cat.id}', ${itemIdx}, 0, ${item.prices[0]})">${cat.sizes[0]}</button>
                                        <button class="size-pill" onclick="changeSize(this, '${cat.id}', ${itemIdx}, 1, ${item.prices[1]})">${cat.sizes[1]}</button>
                                        ${cat.sizes[2] ? `<button class="size-pill" onclick="changeSize(this, '${cat.id}', ${itemIdx}, 2, ${item.prices[2]})">${cat.sizes[2]}</button>` : ''}
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 10px; width: 100%; justify-content: space-between;">
                                        <span class="item-price" id="price_${cat.id}_${itemIdx}">${item.prices[0]} ج.م</span>
                                        <button class="add-to-cart-btn" onclick="addToCartWithSize('${cat.id}', ${itemIdx})">+ أضف</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        itemsHTML += `
                            <div class="menu-item">
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                </div>
                                <div class="item-action" style="flex-direction: row; justify-content: flex-end;">
                                    <span class="item-price">${item.price} ج.م</span>
                                    <button class="add-to-cart-btn" onclick="addToCartSimple('${item.name}', ${item.price})">+ أضف</button>
                                </div>
                            </div>
                        `;
                    }
                });

                section.innerHTML = `
                    <div class="section-header">
                        <h2>${cat.name}</h2>
                    </div>
                    <div class="items-list">
                        ${itemsHTML}
                    </div>
                `;
                container.appendChild(section);
            });

            updateCartUI();
        }

        // حالة الحجم المختختار مؤقتاً للأصناف ذات المقاسات
        const selectedSizes = {};

        function changeSize(btn, catId, itemIdx, sizeIdx, price) {
            const container = btn.parentElement;
            container.querySelectorAll('.size-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById(`price_${catId}_${itemIdx}`).innerText = price + ' ج.م';
            selectedSizes[`${catId}_${itemIdx}`] = { sizeIdx, price };
        }

        function addToCartWithSize(catId, itemIdx) {
            const cat = menuData.find(c => c.id === catId);
            const item = cat.items[itemIdx];
            const key = `${catId}_${itemIdx}`;
            const currentSelection = selectedSizes[key] || { sizeIdx: 0, price: item.prices[0] };
            const sizeName = cat.sizes[currentSelection.sizeIdx];

            const cartItemKey = `${item.name} (${sizeName})`;
            const existing = cart.find(i => i.uniqueKey === cartItemKey);

            if (existing) {
                existing.qty++;
            } else {
                cart.push({
                    uniqueKey: cartItemKey,
                    name: item.name,
                    size: sizeName,
                    price: currentSelection.price,
                    qty: 1
                });
            }
            saveCart();
        }

        function addToCartSimple(name, price) {
            const existing = cart.find(i => i.uniqueKey === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({
                    uniqueKey: name,
                    name: name,
                    size: '',
                    price: price,
                    qty: 1
                });
            }
            saveCart();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            cart.forEach(item => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;
            });

            document.getElementById('cartCount').innerText = `${totalCount} أصناف في السلة`;
            document.getElementById('cartTotal').innerText = `${totalPrice} ج.م`;
            document.getElementById('modalTotal').innerText = `${totalPrice} ج.م`;

            const modalBody = document.getElementById('cartModalBody');
            if (cart.length === 0) {
                modalBody.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 30px;">السلة فارغة حالياً..</p>`;
                return;
            }

            let html = '';
            cart.forEach((item, index) => {
                html += `
                    <div class="cart-item-row">
                        <div>
                            <div style="font-weight: 700;">${item.name} ${item.size ? '- ' + item.size : ''}</div>
                            <div style="color: var(--accent-gold); font-size: 0.9rem;">${item.price * item.qty} ج.م</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            modalBody.innerHTML = html;
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
        }

        function openCartModal() {
            document.getElementById('cartModal').classList.add('active');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function closeCartModalOnOutside(e) {
            if (e.target.id === 'cartModal') {
                closeCartModal();
            }
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let message = `🛒 *طلب جديد من مطعم ${RESTAURANT_CONFIG.restaurantName}*:\n\n`;
            let total = 0;

            cart.forEach(i => {
                message += `▪️ ${i.name} ${i.size ? '(' + i.size + ')' : ''} × ${i.qty} = *${i.price * i.qty} ج.م*\n`;
                total += i.price * i.qty;
            });

            message += `\n💰 *الإجمالي الكلي:* *${total} ج.م*\n\n*(يرجى إضافة العنوان ورقم الهاتف)*`;

            const url = `https://wa.me/${RESTAURANT_CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function callRestaurant() {
            window.location.href = `tel:${RESTAURANT_CONFIG.phoneNumber}`;
        }

        const logoImage = document.querySelector('.logo-image-box img');
        if (logoImage) {
            logoImage.addEventListener('load', () => {
                logoImage.parentElement.classList.add('has-logo');
            });
            logoImage.addEventListener('error', () => {
                logoImage.parentElement.classList.remove('has-logo');
            });
        }

        window.onload = initMenu;
    </script>
